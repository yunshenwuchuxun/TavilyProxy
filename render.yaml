services:
  - type: web
    name: tavily-proxy
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_PATH
        value: /var/data/proxy.db
      - key: TAVILY_BASE_URL
        value: https://api.tavily.com
      - key: UPSTREAM_TIMEOUT
        value: 30s
      - key: MCP_STATELESS
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
